<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Birthday Surprise</title>
    <style>
        body {
            margin: 0;
            background-color: #e0f3ff;
            background-image: radial-gradient(#bcdfff 1px, transparent 1px);
            background-size: 20px 20px;
            font-family: 'Segoe UI', Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            text-align: center;
            width: 100%;
            padding: 10px;
            box-sizing: border-box;
        }

        .title {
            font-size: clamp(1.5rem, 8vw, 3.5rem);
            color: #d63384;
            text-shadow: 2px 2px white;
            margin: 0;
            word-break: break-word;
        }

        .title-letter {
            cursor: pointer;
            display: inline-block;
        }

        .shape-symbol {
            position: absolute;
            font-size: 2.5rem;
            user-select: none;
            pointer-events: none;
            animation: floatShape 3s ease-out forwards;
            text-shadow: 0 0 10px currentColor;
        }

        @keyframes floatShape {
            0% {
                transform: translate(0, 0) scale(1) rotate(0deg);
                opacity: 1;
            }

            100% {
                transform: translate(var(--tx), var(--ty)) scale(0.5) rotate(var(--rotate));
                opacity: 0;
            }
        }

        .date {
            background: #004a9f;
            color: white;
            padding: 5px 15px;
            border-radius: 20px;
            font-weight: bold;
            display: inline-block;
            margin-bottom: 10px;
            cursor: pointer;
            transition: 0.3s;
        }

            .date:hover {
                background: #005bbf;
                transform: scale(1.05);
            }

        .date-input {
            background: white;
            color: #004a9f;
            border: 2px solid #004a9f;
            padding: 5px 15px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 1rem;
            font-family: 'Segoe UI', Arial, sans-serif;
            text-align: center;
            outline: none;
            min-width: 180px;
        }

        .char-container {
            margin: 10px auto;
            position: relative;
            width: 100%;
            max-width: 600px;
            height: auto;
            min-height: 150px;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 0 10px;
            box-sizing: border-box;
        }

        .controller-grid {
            display: flex;
            gap: 6px;
            width: 100%;
            height: 100%;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
        }

            .controller-grid video {
                flex: 1 1 0;
                height: 100%;
                min-height: 150px;
                max-height: 220px;
                object-fit: contain;
                cursor: pointer;
                transition: 0.3s;
                border: 3px solid transparent;
                border-radius: 10px;
                min-width: 0;
                background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            }

                .controller-grid video:hover {
                    border-color: #004a9f;
                    transform: scale(1.05);
                }

        #controller-lottie {
            width: 100%;
            height: 100%;
        }

        .name-tag {
            background: #004a9f;
            color: white;
            padding: 6px 20px;
            border-radius: 20px;
            display: block;
            margin: 12px auto 8px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
            max-width: fit-content;
        }

            .name-tag:hover {
                background: #005bbf;
                transform: scale(1.05);
            }

        .name-input {
            background: white;
            color: #004a9f;
            border: 2px solid #004a9f;
            padding: 6px 20px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 1rem;
            font-family: 'Segoe UI', Arial, sans-serif;
            text-align: center;
            outline: none;
            min-width: 200px;
        }

        #openBtn {
            background-color: #004a9f;
            color: white;
            border: none;
            padding: 15px 40px;
            border-radius: 50px;
            cursor: pointer;
            font-size: 1.2rem;
            transition: 0.3s;
            box-shadow: 0 5px 15px rgba(0, 74, 159, 0.3);
            display: block;
            margin: 0 auto;
        }

            #openBtn:hover {
                transform: scale(1.1);
                background-color: #003a7b;
            }

        .modal {
            display: none;
            position: fixed;
            z-index: 100;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.5);
            backdrop-filter: blur(5px);
        }

        .modal-content {
            background-color: #fff;
            margin: 5% auto;
            padding: 20px;
            border-radius: 25px;
            width: 90%;
            max-width: 500px;
            position: relative;
            text-align: center;
            animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-sizing: border-box;
            max-height: 90vh;
            overflow-y: auto;
        }

        @keyframes popIn {
            0% {
                transform: scale(0.5);
                opacity: 0;
            }

            100% {
                transform: scale(1);
                opacity: 1;
            }
        }

        .message {
            font-style: italic;
            color: #666;
            font-size: clamp(0.9rem, 3vw, 1.2rem);
            margin: 20px 0;
            cursor: pointer;
            transition: 0.3s;
            padding: 10px;
            border-radius: 10px;
        }

            .message:hover {
                background: #f0f0f0;
                transform: scale(1.02);
            }

        .message-input {
            background: white;
            color: #333;
            border: 2px solid #004a9f;
            padding: 10px 15px;
            border-radius: 10px;
            font-style: italic;
            font-size: 1.2rem;
            font-family: 'Segoe UI', Arial, sans-serif;
            text-align: center;
            outline: none;
            width: 90%;
            resize: vertical;
            min-height: 60px;
        }

        .close {
            position: absolute;
            right: 25px;
            top: 15px;
            font-size: 30px;
            cursor: pointer;
            color: #aaa;
        }

        .heart {
            position: absolute;
            font-size: 25px;
            user-select: none;
            pointer-events: none;
            animation: floatUp 3s ease-out forwards;
        }

        @keyframes floatUp {
            0% {
                transform: translateY(0) scale(1);
                opacity: 1;
            }

            100% {
                transform: translateY(-400px) scale(1.5);
                opacity: 0;
            }
        }

        @media screen and (max-width: 768px) {
            .title {
                font-size: clamp(1.2rem, 6vw, 2.5rem);
            }

            .controller-grid {
                flex-direction: column;
                gap: 10px;
            }

                .controller-grid video {
                    width: 90%;
                    max-width: 300px;
                    height: auto;
                    min-height: 120px;
                    max-height: 180px;
                }

            .char-container {
                min-height: auto;
                height: auto;
            }

            .modal-content {
                padding: 15px;
                margin: 2% auto;
            }

            #openBtn {
                padding: 12px 30px;
                font-size: 1rem;
            }

            .date {
                font-size: 0.9rem;
                padding: 4px 12px;
            }

            .name-tag {
                font-size: 0.9rem;
                padding: 5px 15px;
            }
        }

        @media screen and (max-width: 480px) {
            .title {
                font-size: clamp(1rem, 5vw, 2rem);
            }

            .controller-grid video {
                width: 95%;
                max-width: 250px;
                min-height: 100px;
                max-height: 150px;
            }

            #openBtn {
                padding: 10px 25px;
                font-size: 0.9rem;
            }

            .modal-content {
                padding: 10px;
                width: 95%;
            }

            #gamer-video {
                width: 150px !important;
                height: 150px !important;
                min-height: 150px !important;
            }
        }

        #gamer-video {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 10px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1 class="title">
            <span class="title-letter">H</span>
            <span class="title-letter">a</span>
            <span class="title-letter">p</span>
            <span class="title-letter">p</span>
            <span class="title-letter">y</span>
            &nbsp;
            <span class="title-letter">B</span>
            <span class="title-letter">i</span>
            <span class="title-letter">r</span>
            <span class="title-letter">t</span>
            <span class="title-letter">h</span>
            <span class="title-letter">d</span>
            <span class="title-letter">a</span>
            <span class="title-letter">y</span>
        </h1>
        <div class="name-tag" id="nameTag">Kaison Jude Prins</div>

       <div class="char-container">
            <div class="controller-grid">
                <video autoplay loop muted playsinline preload="auto" id="ctrlVid1">
                    <source src="videos/Controller.mp4" type="video/mp4">
                </video>
                <video autoplay loop muted playsinline preload="auto" id="ctrlVid2">
                    <source src="videos/Controller3.mp4" type="video/mp4">
                </video>
                <video autoplay loop muted playsinline preload="auto" id="ctrlVid3">
                    <source src="videos/Controller4.mp4" type="video/mp4">
                </video>
            </div>
        </div>

        <button id="openBtn">Open Your Gift 🎁</button>

        <div class="upload-section" style="margin: 25px auto; padding: 15px; background: rgba(0,74,159,0.1); border-radius: 12px; max-width: 320px; border: 2px dashed #004a9f;">
            <h4 style="color: #004a9f; margin-top: 0; margin-bottom: 10px; font-size: 1.1rem;">Upload a Birthday Message!</h4>
            <input type="file" id="videoInput" accept="video/*" style="margin-bottom: 10px; max-width: 100%; font-family: 'Segoe UI', Arial, sans-serif; font-size: 0.85rem;">
            <br>
            <button id="uploadBtn" style="padding: 8px 16px; cursor: pointer; border-radius: 20px; background-color: #004a9f; color: white; border: none; font-weight: bold; font-size: 0.9rem; transition: 0.3s;">
                Upload Video
            </button>
            <p id="uploadStatus" style="margin-top: 10px; font-weight: bold; color: #004a9f; font-size: 0.85rem; margin-bottom: 0;"></p>
        </div>

        <div id="videoGrid" style="display: flex; flex-wrap: wrap; gap: 15px; justify-content: center; margin-top: 10px; margin-bottom: 40px;"></div>

    </div>

    <div id="cardModal" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <video id="gamer-video" loop muted playsinline controls preload="auto" style="width:200px; height:200px; margin:0 auto; display:block; background:#667eea;">
                <source src="videos/Cool Gamer.mp4" type="video/mp4">
                Your browser does not support the video tag.
            </video>
            <div id="video-fallback" style="display:none; margin-top:12px; color:#c00;">
                Can't play the video inline. <a id="video-open-link" href="videos/Cool%20Gamer.mp4" target="_blank" rel="noopener">Open video in a new tab</a>
            </div>
            <h3>Level Up! 🎮</h3>
            <p class="message" id="messageText">"You are a very special boy. I wish you all the best, lots of health, and lots of joy. Happy Birthday!"</p>
            <div id="heart-container"></div>
        </div>
    </div>

    <script src="github-config.js"></script>
    <script src="script.js"></script>
    <script>
        const modal = document.getElementById("cardModal");
        const btn = document.getElementById("openBtn");
        const span = document.querySelector(".close");
        const heartContainer = document.getElementById("heart-container");
        const gamerVideo = document.getElementById("gamer-video");
        const titleLetters = document.querySelectorAll(".title-letter");

        const WORKER_URL = (typeof githubConfig !== 'undefined' && githubConfig.workerUrl)
            ? githubConfig.workerUrl
            : '';

        async function fetchRemoteProfile() {
            if (!WORKER_URL) return null;
            try {
                const response = await fetch(`${WORKER_URL}/db`, { cache: 'no-store' });
                if (!response.ok) return null;
                const db = await response.json();
                return db.profile || null;
            } catch (error) {
                console.error('Failed to fetch remote profile:', error);
                return null;
            }
        }

        async function saveRemoteName(name) {
            if (!WORKER_URL) return;
            try {
                let db = { videos: {}, lastUpdated: 0 };
                try {
                    const response = await fetch(`${WORKER_URL}/db`, { cache: 'no-store' });
                    if (response.ok) {
                        db = await response.json();
                    }
                } catch (readError) {
                    console.warn('Failed to read DB before saving name, creating new one:', readError);
                }

                if (!db.videos) db.videos = {};
                db.profile = db.profile || {};
                db.profile.name = name;
                db.lastUpdated = Date.now();

                await fetch(`${WORKER_URL}/update-db`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ dbContent: db })
                });
            } catch (error) {
                console.error('Failed to save remote name:', error);
            }
        }

        (async function initPersonalization() {
            const urlParams = new URLSearchParams(window.location.search);
            const customName = urlParams.get('name');
            const customMessage = urlParams.get('message');

            const savedName = localStorage.getItem('birthdayName');
            const savedMessage = localStorage.getItem('birthdayMessage');

            const nameTagEl = document.getElementById('nameTag');
            const messageEl = document.getElementById('messageText');

            let remoteProfile = null;
            if (!customName) {
                remoteProfile = await fetchRemoteProfile();
            }

            if (customName && nameTagEl) {
                nameTagEl.textContent = customName;
                localStorage.setItem('birthdayName', customName);
                saveRemoteName(customName);
            } else if (remoteProfile && remoteProfile.name && nameTagEl) {
                nameTagEl.textContent = remoteProfile.name;
                localStorage.setItem('birthdayName', remoteProfile.name);
            } else if (savedName && nameTagEl) {
                nameTagEl.textContent = savedName;
            }

            if (customMessage && messageEl) {
                messageEl.textContent = customMessage;
                localStorage.setItem('birthdayMessage', customMessage);
            } else if (savedMessage && messageEl) {
                messageEl.textContent = savedMessage;
            }
        })();

        const nameTag = document.getElementById('nameTag');
        nameTag.addEventListener('click', function () {
            const currentName = nameTag.textContent;
            const input = document.createElement('input');
            input.type = 'text';
            input.value = currentName;
            input.className = 'name-input';

            nameTag.replaceWith(input);
            input.focus();
            input.select();

            function saveName() {
                const newName = input.value.trim() || currentName;
                const newNameTag = document.createElement('div');
                newNameTag.className = 'name-tag';
                newNameTag.id = 'nameTag';
                newNameTag.textContent = newName;

                localStorage.setItem('birthdayName', newName);
                saveRemoteName(newName);

                input.replaceWith(newNameTag);
                newNameTag.addEventListener('click', arguments.callee.bind(nameTag));
            }

            input.addEventListener('blur', saveName);
            input.addEventListener('keypress', function (e) {
                if (e.key === 'Enter') {
                    saveName();
                }
            });
        });

        const messageText = document.getElementById('messageText');
        messageText.addEventListener('click', function () {
            const currentMessage = messageText.textContent;
            const textarea = document.createElement('textarea');
            textarea.value = currentMessage;
            textarea.className = 'message-input';

            messageText.replaceWith(textarea);
            textarea.focus();
            textarea.select();

            function saveMessage() {
                const newMessage = textarea.value.trim() || currentMessage;
                const newMessageText = document.createElement('p');
                newMessageText.className = 'message';
                newMessageText.id = 'messageText';
                newMessageText.textContent = newMessage;

                localStorage.setItem('birthdayMessage', newMessage);
                textarea.replaceWith(newMessageText);
                newMessageText.addEventListener('click', arguments.callee.bind(messageText));
            }

            textarea.addEventListener('blur', saveMessage);
            textarea.addEventListener('keypress', function (e) {
                if (e.key === 'Enter' && e.ctrlKey) {
                    saveMessage();
                }
            });
        });

        btn.onclick = () => {
            modal.style.display = "block";
            if (gamerVideo) {
                gamerVideo.load();
                gamerVideo.currentTime = 0;

                setTimeout(() => {
                    const playPromise = gamerVideo.play();
                    if (playPromise && playPromise.catch) {
                        playPromise.catch(err => {
                            console.error('gamer-video play failed:', err);
                            gamerVideo.muted = false;
                            gamerVideo.play().catch(err2 => {
                                console.error('Second play attempt failed:', err2);
                                const vf = document.getElementById('video-fallback');
                                if (vf) vf.style.display = 'block';
                            });
                        });
                    }
                }, 300);
            }
            for (let i = 0; i < 30; i++) { setTimeout(createHeart, i * 60); }
        };

        span.onclick = () => {
            modal.style.display = "none";
            if (gamerVideo) gamerVideo.pause();
        };
        window.onclick = (e) => {
            if (e.target == modal) {
                modal.style.display = "none";
                if (gamerVideo) gamerVideo.pause();
            }
        };

        function createShape(clickX, clickY) {
            const symbols = ["■", "▲", "✖", "●"];
            const colors = ["#ff6ec7", "#00e6a8", "#5da9ff", "#ff4b4b", "#ffd700", "#00ff00", "#ff00ff", "#00ffff"];

            const numShapes = 80 + Math.floor(Math.random() * 40);

            for (let i = 0; i < numShapes; i++) {
                setTimeout(() => {
                    const index = Math.floor(Math.random() * symbols.length);
                    const shape = document.createElement("div");
                    shape.className = "shape-symbol";
                    shape.textContent = symbols[index];
                    shape.style.color = colors[Math.floor(Math.random() * colors.length)];

                    const size = 1.5 + Math.random() * 2;
                    shape.style.fontSize = size + 'rem';
                    shape.style.left = clickX + 'px';
                    shape.style.top = clickY + 'px';

                    const angle = Math.random() * Math.PI * 2;
                    const distance = 200 + Math.random() * 800;
                    const tx = Math.cos(angle) * distance;
                    const ty = Math.sin(angle) * distance;
                    const rotate = Math.random() * 1440 - 720;

                    shape.style.setProperty('--tx', tx + 'px');
                    shape.style.setProperty('--ty', ty + 'px');
                    shape.style.setProperty('--rotate', rotate + 'deg');

                    document.body.appendChild(shape);
                    setTimeout(() => shape.remove(), 3000);
                }, i * 15);
            }
        }

        function createHeart() {
            const heart = document.createElement("div");
            heart.className = "heart";
            heart.innerHTML = "❤️";
            heart.style.left = Math.random() * 90 + "%";
            heart.style.top = "60%";
            heartContainer.appendChild(heart);
            setTimeout(() => heart.remove(), 3000);
        }

        titleLetters.forEach(letter => {
            letter.addEventListener("click", (e) => {
                const rect = letter.getBoundingClientRect();
                const clickX = rect.left + rect.width / 2;
                const clickY = rect.top + rect.height / 2;
                createShape(clickX, clickY);
            });
        });

        if (gamerVideo) {
            gamerVideo.addEventListener('error', (e) => {
                console.error('gamer-video error', e);
                const vf = document.getElementById('video-fallback');
                if (vf) vf.style.display = 'block';
            });
            gamerVideo.addEventListener('loadeddata', () => { console.log('gamer-video loadeddata, readyState=', gamerVideo.readyState); });
        }

        const controllerVideos = document.querySelectorAll('.controller-grid video');
        controllerVideos.forEach((video, index) => {
            setTimeout(() => {
                video.play().catch(() => { });
            }, index * 300);
        });
    </script>
</body>
</html>
